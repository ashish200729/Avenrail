name: Bug report
description: Report a problem in Avenrail
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Avenrail publishes macOS (Apple Silicon) builds and supports Linux source builds. Include your operating system and provider CLI version.

  - type: input
    id: version
    attributes:
      label: Avenrail version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: Operating system and version
      placeholder: "macOS 15.5 or Ubuntu 24.04 / GNOME"
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Provider CLI
      options:
        - Claude Code
        - Codex
        - Cursor
        - OpenCode
        - Pi
        - omp
        - fx
        - Multiple / not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
